name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  folders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Script tests
        run: node --test scripts/check-folders.test.mjs
      - name: App folders are Android package names
        run: node scripts/check-folders.mjs
